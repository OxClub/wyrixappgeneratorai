name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build every package.json found
        run: |
          for d in . frontend backend client server web api; do
            if [ -f "$d/package.json" ]; then
              echo "== $d =="
              (cd "$d" && (npm ci || npm install) && npm run build --if-present)
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          if-no-files-found: warn
          path: |
            dist
            build
            frontend/dist
            frontend/build
            client/dist
            client/build
